<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Tic Tac Toe</title>
  </head>
  <body class="bg-canvas h-svh">
    <div class="w-full h-svh max-w-6xl mx-auto px-12 pt-6">
      <!-- Header -->
      <header class="w-full h-11 flex items-center justify-between">
        <div class="text-base font-sans font-semibold text-ink">Tic Tac Toe</div>
        <div class="space-x-1">
          <button class="rounded-full p-2 bg-fill cursor-pointer" aria-label="Sound" aria-pressed="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
              <path d="M16.5 8.5a5 5 0 010 7"></path>
            </svg>
          </button>
          <button class="rounded-full p-2 bg-fill cursor-pointer" aria-label="Toggle light and dark mode ">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!--main  -->
      <main class="w-full grid grid-cols-[640px_340px] justify-center mt-42 pr-20">
        <div class="w-160 flex flex-col items-center justify-center">
          <h1
            id="title"
            class="font-sans font-bold text-[40px] text-center mb-6 text-ink tracking-tight motion-reduce:animate-none"
          >
            Your Turn
          </h1>

          <!-- tic tac toe grid -->
          <div id="board" class=" relative grid grid-cols-3 gap-3">
            <button
              data-tile
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-hover-line transition-all duration-110 enabled:hover:bg-hover enabled:hover:border-hover-line disabled:cursor-default"
            ></button>
            <button
              data-tile
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-hover-line transition-all duration-110 enabled:hover:bg-hover enabled:hover:border-hover-line disabled:cursor-default"
            ></button>
            <button
              data-tile
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-hover-line transition-all duration-110 enabled:hover:bg-hover enabled:hover:border-hover-line disabled:cursor-default"
            ></button>
            <button
              data-tile
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-hover-line transition-all duration-110 enabled:hover:bg-hover enabled:hover:border-hover-line disabled:cursor-default"
            ></button>
            <button
              data-tile
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-hover-line transition-all duration-110 enabled:hover:bg-hover enabled:hover:border-hover-line disabled:cursor-default"
            ></button>
            <button
              data-tile
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-hover-line transition-all duration-110 enabled:hover:bg-hover enabled:hover:border-hover-line disabled:cursor-default"
            ></button>
            <button
              data-tile
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-hover-line transition-all duration-110 enabled:hover:bg-hover enabled:hover:border-hover-line disabled:cursor-default"
            ></button>
            <button
              data-tile
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-hover-line transition-all duration-110 enabled:hover:bg-hover enabled:hover:border-hover-line disabled:cursor-default"
            ></button>
            <button
              data-tile
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-hover-line transition-all duration-110 enabled:hover:bg-hover enabled:hover:border-hover-line disabled:cursor-default"
            ></button>
            <!-- slash   -->
            <svg id="slash" class="pointer-events-none absolute inset-0 size-full opacity-0" aria-hidden="true">
              <line class="stroke-canvas" stroke-width="8" stroke-linecap="round" />
              <line class="stroke-ink" stroke-width="4" stroke-linecap="round" />
            </svg>
          </div>
          </div>


        <!-- info box  -->
        <div class="w-85 h-75 my-auto">
          <!-- mode selector -->
          <div id="mode" class="relative flex h-11 w-full items-center rounded-full bg-fill p-1">
            <span
              class="thumb pointer-events-none absolute top-1 bottom-1 left-0 w-0 rounded-full bg-raised shadow-sm transition-[transform,width] duration-500 ease-pill data-instant:transition-none"
            ></span>
            <button
              data-v="cpu"
              aria-pressed="true"
              class="relative z-10 h-full flex-1 cursor-pointer rounded-full text-sm font-medium text-ink-soft transition-colors duration-300 aria-pressed:text-ink"
            >
              vs Computer
            </button>
            <button
              data-v="pvp"
              aria-pressed="false"
              class="relative z-10 h-full flex-1 cursor-pointer rounded-full text-sm font-medium text-ink-soft transition-colors duration-300 aria-pressed:text-ink"
            >
              Pass &amp; Play
            </button>
          </div>

          <!-- level selector -->
          <div
            id="level"
            class="relative mt-3 flex h-9 w-full items-center overflow-hidden rounded-full bg-fill p-1 transition-all duration-500 ease-expo data-off:mt-0 data-off:h-0 data-off:-translate-y-2 data-off:py-0 data-off:opacity-0"
          >
            <span
              class="thumb pointer-events-none absolute top-1 bottom-1 left-0 w-0 rounded-full bg-raised shadow-sm transition-[transform,width] duration-500 ease-pill data-instant:transition-none motion-reduce:transition-none"
            ></span>
            <button
              data-v="easy"
              aria-pressed="false"
              class="relative z-10 h-full flex-1 cursor-pointer rounded-full text-sm font-medium text-ink-soft transition-colors duration-300 aria-pressed:text-ink"
            >
              Easy
            </button>
            <button
              data-v="medium"
              aria-pressed="true"
              class="relative z-10 h-full flex-1 cursor-pointer rounded-full text-sm font-medium text-ink-soft transition-colors duration-300 aria-pressed:text-ink"
            >
              Medium
            </button>
            <button
              data-v="hard"
              aria-pressed="false"
              class="relative z-10 h-full flex-1 cursor-pointer rounded-full text-sm font-medium text-ink-soft transition-colors duration-300 aria-pressed:text-ink"
            >
              Hard
            </button>
          </div>

          <!-- score -->
          <div class="flex justify-between gap-2 w-full my-8">
            <div
              data-score="x"
              class="group flex-1 h-23 bg-tile rounded-2xl border border-transparent shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] flex flex-col items-center justify-center transition-colors duration-500 data-turn:border-ink data-win:bg-invert"
            >
              <span
                data-n
                class="font-sans text-4xl font-bold text-ink tabular-nums transition-colors duration-500 group-data-win:text-on-invert"
                >0</span
              >
              <span
                data-l
                class="font-medium font-sans text-ink-soft/90 text-sm mt-1.5 transition-colors duration-500 group-data-win:text-on-invert/70"
                >You</span
              >
            </div>

            <div
              data-score="d"
              class="group flex-1 h-23 bg-tile rounded-2xl border border-transparent shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] flex flex-col items-center justify-center transition-colors duration-500 data-turn:border-ink data-win:bg-invert"
            >
              <span
                data-n
                class="font-sans text-4xl font-bold text-ink tabular-nums transition-colors duration-500 group-data-win:text-on-invert"
                >0</span
              >
              <span
                data-l
                class="font-medium font-sans text-ink-soft/90 text-sm mt-1.5 transition-colors duration-500 group-data-win:text-on-invert/70"
                >Draws</span
              >
            </div>

            <div
              data-score="o"
              class="group flex-1 h-23 bg-tile rounded-2xl border border-transparent shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] flex flex-col items-center justify-center transition-colors duration-500 data-turn:border-ink data-win:bg-invert"
            >
              <span
                data-n
                class="font-sans text-4xl font-bold text-ink tabular-nums transition-colors duration-500 group-data-win:text-on-invert"
                >0</span
              >
              <span
                data-l
                class="font-medium font-sans text-ink-soft/90 text-sm mt-1.5 transition-colors duration-500 group-data-win:text-on-invert/70"
                >Computer</span
              >
            </div>
          </div>

          <!-- control buttons-->
          <div class="w-full flex gap-3">
            <button
              id="reset-score"
              class="flex-1 h-11 font-sans text-ink bg-fill font-medium text-[14px] rounded-3xl cursor-pointer"
            >
              Reset Score
            </button>
            <button
              id="new-game"
              class="flex-1 h-11 font-sans text-[14px] font-medium rounded-3xl bg-ink text-tile cursor-pointer"
            >
              New Game
            </button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
