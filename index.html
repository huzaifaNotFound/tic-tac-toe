<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Tic Tac Toe</title>
  </head>
  <body class="bg-canvas h-svh">
    <div class="w-full h-svh max-w-6xl mx-auto px-12 pt-6">
      <!-- Header -->
      <header class="w-full h-11 flex items-center justify-between">
        <div class="text-base font-sans font-semibold text-ink">Tic Tac Toe</div>
        <div class="space-x-1">
          <button class="rounded-full p-2 bg-fill" aria-label="Sound" aria-pressed="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
              <path d="M16.5 8.5a5 5 0 010 7"></path>
            </svg>
          </button>
          <button class="rounded-full p-2 bg-fill" aria-label="Toggle light and dark mode">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!--main-->
      <main class="w-full flex-1 flex items-center justify-center mt-42">
        <div class="w-160 h-auto flex flex-col items-center justify-center">
          <h1 class="font-sans font-bold text-[40px] text-center mb-6 text-ink">Your Turn</h1>

          <!-- tic tac toe grid -->
          <div class="grid grid-cols-3 gap-3">
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110"
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110"
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110"
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110"
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110"
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110"
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110"
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110"
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110"
            ></button>
          </div>
        </div>

        <!-- info box-->
        <div class="h-75 w-85 bg-amber-50">
          <div class="w-full rounded-full bg-fill h-11 flex items-center justify-between p-[5px]">
            <button class="h-full w-41 bg-tile rounded-full text-ink font-sans text-sm font-medium shadow-sm">vs Computer</button>
            <button class="h-full w-41 rounded-full text-ink-soft  font-sans text-sm font-medium">Pass & Play</button>
          </div>

          <div class="w-full rounded-full bg-fill h-9 flex items-center justify-between p-[5px] mt-3">
            <button class="h-full w-27 rounded-full text-ink-soft font-sans text-sm font-medium">Easy</button>
            <button class="h-full w-27 bg-tile rounded-full text-ink font-sans text-sm font-medium shadow-sm">Medium</button>
            <button class="h-full w-27 rounded-full text-ink-soft font-sans text-sm font-medium">Hard</button>
          </div>
          <div>
            <div><span>0</span><span>You</span></div>
            <div><span>0</span><span>Draws</span></div>
            <div><span>0</span> <span>Computer</span></div>
          </div>
          <div><button>Reset Score</button> <button>New Game</button></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
