<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Tic Tac Toe</title>
  </head>
  <body class="bg-canvas h-dvh">
    <div class="w-full h-full max-w-6xl mx-auto px-12 py-6">
      <!-- Header -->
      <header class="w-full h-11 flex items-center justify-between">
        <div class="text-base font-sans font-semibold">Tic Tac Toe</div>
        <div class="space-x-1">
          <button class="rounded-full p-2 bg-fill" aria-label="Sound" aria-pressed="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
              <path d="M16.5 8.5a5 5 0 010 7"></path>
            </svg>
          </button>
          <button class="rounded-full p-2 bg-fill" aria-label="Toggle light and dark mode">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path>
            </svg>
          </button>
        </div>
      </header>


      <!--main-->
      <main class="w-full h-screen flex items-center justify-center space-x-24 pb-20">
        <div
          class="w-160 h-160 flex flex-col items-center justify-center "
        >
          <h1 class="font-sans font-bold text-[40px] text-center mb-6">Your Turn</h1>

          <!-- tic tac toe grid -->
          <div class="grid grid-cols-3 gap-3">
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110 "
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110 "
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110 "
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110 "
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110 "
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110 "
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110 "
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110 "
            ></button>
            <button
              class="h-35 w-35 bg-tile rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04),0_8px_24px_rgba(0,0,0,0.05)] border border-line cursor-pointer hover:bg-hover hover:border-2 transition-all duration-110 "
            ></button>
          </div>
        </div>

        <!-- info box-->
        <div class="h-75 w-85 ">
          
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
