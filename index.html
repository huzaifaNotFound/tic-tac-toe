<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Tic Tac Toe</title>
    <script>
      //system theme
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-svh bg-canvas font-sans text-ink antialiased">
    <div class="mx-auto flex min-h-svh w-full max-w-6xl flex-col px-5 pt-4 pb-5 sm:px-12 lg:pt-6 lg:pb-10">
      <!-- header -->
      <header class="flex h-11 w-full items-center justify-between">
        <div class="text-base font-semibold">Tic Tac Toe</div>
        <div class="flex gap-2">
          <button class="icon-btn" aria-label="Sound" aria-pressed="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
              <path d="M16.5 8.5a5 5 0 010 7"></path>
            </svg>
          </button>
          <button id="theme" class="icon-btn icon-stack" aria-label="Switch to dark mode">
            <svg
              class="moon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path>
            </svg>
            <svg
              class="sun"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              ></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- main -->
      <main
        class="flex flex-1 flex-col items-center justify-center gap-0 py-2 lg:py-[min(2rem,3svh)] lg:grid lg:grid-cols-[auto_340px] lg:content-center lg:items-center lg:justify-center lg:gap-24"
     >
        <section class="flex flex-col items-center max-lg:mt-4">
          <h1 id="title" aria-live="polite" class="mb-3 text-center text-[clamp(28px,5svh,40px)] font-bold tracking-tight lg:mb-6">Your Turn</h1>

          <!-- tic tac toe -->
          <div id="board" class="relative grid w-[clamp(180px,calc(100svh-26rem),min(444px,calc(100vw-2.5rem)))] lg:w-[clamp(240px,calc(100svh-17rem),444px)] grid-cols-3 gap-2.5 sm:gap-3">
            <button data-tile class="tile"></button>
            <button data-tile class="tile"></button>
            <button data-tile class="tile"></button>
            <button data-tile class="tile"></button>
            <button data-tile class="tile"></button>
            <button data-tile class="tile"></button>
            <button data-tile class="tile"></button>
            <button data-tile class="tile"></button>
            <button data-tile class="tile"></button>

            <!--slash -->
            <svg id="slash" class="pointer-events-none absolute inset-0 size-full opacity-0" aria-hidden="true">
              <line class="stroke-canvas" stroke-width="8" stroke-linecap="round" />
              <line class="stroke-ink" stroke-width="4" stroke-linecap="round" />
            </svg>
          </div>
        </section>

  
        <div class="w-full max-w-111 lg:max-w-85 max-lg:contents max-lg:*:w-full max-lg:*:max-w-111">
          <!-- mode selector -->
          <div id="mode" class="seg h-11 order-first" role="group" aria-label="Game mode">
            <span class="thumb" aria-hidden="true"></span>
            <button data-v="cpu" aria-pressed="true" class="seg-btn">vs Computer</button>
            <button data-v="pvp" aria-pressed="false" class="seg-btn">Pass &amp; Play</button>
          </div>

          <!-- level seltor -->
          <div id="level" class="seg level order-first" role="group" aria-label="Difficulty">
            <span class="thumb" aria-hidden="true"></span>
            <button data-v="easy" aria-pressed="false" class="seg-btn">Easy</button>
            <button data-v="medium" aria-pressed="true" class="seg-btn">Medium</button>
            <button data-v="hard" aria-pressed="false" class="seg-btn">Hard</button>
          </div>

          <!-- score -->
          <div class="my-4 flex w-full gap-2 lg:my-8">
            <div data-score="x" class="score-card">
              <span data-n class="score-n">0</span><span data-l class="score-l">You</span>
            </div>
            <div data-score="d" class="score-card">
              <span data-n class="score-n">0</span><span data-l class="score-l">Draws</span>
            </div>
            <div data-score="o" class="score-card">
              <span data-n class="score-n">0</span><span data-l class="score-l">Computer</span>
            </div>
          </div>

          <!-- control buttons -->
          <div class="flex w-full gap-3">
            <button id="reset-score" class="btn btn-secondary">Reset Score</button>
            <button id="new-game" class="btn btn-primary">New Game</button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
